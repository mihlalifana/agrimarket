{% extends "base.html" %}{% block title %}Reset password{% endblock %}
{% block content %}
<div class="auth-box card">
  <h1>Reset your password</h1>
  <p class="muted">Enter your email address. We will send a link valid for 30 minutes.</p>
  <form method="post">{% csrf_token %}{% include "includes/form.html" %}<button class="btn block">Send reset link</button></form>
</div>
{% endblock %}
